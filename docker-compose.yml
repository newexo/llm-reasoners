services:
  llm-reasoners:
    build: .
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - hf-cache:/workspace/.cache/huggingface
      - .:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
